name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        part: [hub, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install
        working-directory: ${{ matrix.part }}
        run: npm install --no-audit --no-fund
      - name: test
        working-directory: ${{ matrix.part }}
        run: npm test
      - name: syntax check of the UI bundle
        if: matrix.part == 'hub'
        run: node --check hub/public/app.js
